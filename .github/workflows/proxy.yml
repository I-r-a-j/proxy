name: Update Proxies

on:
  schedule:
    - cron: "*/10 * * * *"   # Run every 10 minutes
  workflow_dispatch:         # Allow manual trigger from GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run proxy script
        id: run_script
        run: |
          python update_proxies.py | tee script_output.log

      - name: Save clean report
        run: |
          echo "===== Run at $(date -u) =====" > reports.txt
          # Extract summary lines only (Done + number of working proxies)
          grep -E "🎉 Done!|🔍 Total unique proxies" script_output.log >> reports.txt
          echo "" >> reports.txt

      - name: Commit & Push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add working_proxies.txt reports.txt
          git commit -m "Update working proxies + report [skip ci]" || echo "No changes to commit"
          git push
